<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Rajdhani:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Overlay de inicialização (única adição necessária) -->


    <div class="dhlp-container">
        <button class="dhlp-btn" id="dhlpBtn">DHLP</button>
    </div>

    <div class="main-container">
        <h1>TEMPO SEM FALAR COM VOCÊ</h1>

        <div class="time-container">
            <div class="time-block">
                <div class="time-value" id="hours">123</div>
                <div class="time-label">HORAS</div>
            </div>
            <div class="separator">|</div>
            <div class="time-block">
                <div class="time-value" id="minutes">01</div>
                <div class="time-label">MINUTOS</div>
            </div>
            <div class="separator">|</div>
            <div class="time-block">
                <div class="time-value" id="seconds">41</div>
                <div class="time-label">SEGUNDOS</div>
            </div>
        </div>

        <div class="days-badge" id="daysBadge">5 DIAS</div>
    </div>

<!-- Contador principal -->

    <button class="read-more-btn" id="readMoreBtn">❤ Ler mais ❤</button>

    <div class="additional-content" id="additionalContent">
        <p>Sem comentarios 

        </p>





    </div>

    <div class="music-player-container">
        <div class="music-player">
            <div class="music-display">
                <div class="music-text" id="musicText">
                    <span class="song-name">Quando Bate Aquela Saudade</span>
                    <span class="artist-name">Canção de Rubel ‧ 2013</span>
                </div>
            </div>
            <button class="music-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
        </div>
    </div>

    <div class="video-container" id="videoContainer">
        <div class="video-loading" id="videoLoading">
            <div class="loading-spinner"></div>
            <p>Nao tem video...</p>
        </div>
        <button class="close-btn" id="closeBtn">✕</button>
        <div class="video-player">
            <video controls id="myVideo">
                <source src="" type="video/mp4">
            </video>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="" type="audio/mpeg">
    </audio>

    <script src="main.js" defer></script>
</body>

</html>
